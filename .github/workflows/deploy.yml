name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
        working-directory: webapp
      - run: npm run build
        working-directory: webapp
        env:
          # Vite bakes these into the built JS at this step, so the GitHub
          # Pages deploy needs them here too, not just in the local,
          # gitignored webapp/.env. The anon/publishable key is designed
          # to be public — it can only do what the Supabase project's Row
          # Level Security policies allow (see supabase/schema.sql), which
          # is exactly the same trust boundary as it already being visible
          # in every visitor's browser bundle — so committing it directly
          # here (rather than a repo secret) doesn't weaken anything.
          VITE_SUPABASE_URL: https://cvqhyjvcszkscnnfzika.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_Xl0xxMUfJeX-fC_CSTTE_g_B19c1CkN
      - uses: actions/upload-pages-artifact@v3
        with:
          path: webapp/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
