name: Rebalance email reminder (report 48 proof of concept)
on:
  schedule:
    # 12:00 UTC = 17:30 IST, after NSE's 15:30 IST close. Runs every day
    # so it can catch the 5/3/1-day-before marks whenever they land.
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Send even if today isn't 5/3/1 days before the estimated rebalance"
        type: boolean
        default: true
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy yfinance
      - env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            python notify_email.py --force
          else
            python notify_email.py
          fi
