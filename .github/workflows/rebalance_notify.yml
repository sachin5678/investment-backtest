name: Rebalance notification (report 48 proof of concept)
on:
  schedule:
    # 12:00 UTC = 17:30 IST, after NSE's 15:30 IST close.
    - cron: "0 12 * * 1-5"
    # 9:30 UTC = 3:00 PM IST, before the 15:30 IST close — the
    # "--pre-close" FINAL CALL run: only actually sends when today is the
    # exact estimated rebalance day (see notify_rebalance.py's docstring
    # for why 3 PM specifically needs a separate, earlier run).
    - cron: "30 9 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Send even if today isn't in the rebalance alert window"
        type: boolean
        default: true
      pre_close:
        description: "Run as the ~3 PM pre-close FINAL CALL instead of the after-close reminder"
        type: boolean
        default: false
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy yfinance requests
      - env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          ARGS=""
          if [ "${{ inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          if [ "${{ github.event.schedule }}" = "30 9 * * 1-5" ] || [ "${{ inputs.pre_close }}" = "true" ]; then
            ARGS="$ARGS --pre-close"
          fi
          python notify_rebalance.py $ARGS
